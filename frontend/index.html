<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User App — Event-Driven</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Quản lý thông tin</h1>
    <nav>
      <a href="#/new" data-route="new">Nhập thông tin</a>
      <a href="#/list" data-route="list">Danh sách</a>
      <a href="http://localhost:8025" target="_blank" rel="noopener">Mailpit ↗</a>
      <a href="http://localhost:15672" target="_blank" rel="noopener">RabbitMQ ↗</a>
      <a href="http://localhost:4005/audit" target="_blank" rel="noopener">Audit ↗</a>
      <a href="http://localhost:4004/stats" target="_blank" rel="noopener">Stats ↗</a>
    </nav>
  </header>

  <main>
    <div id="toast" class="toast" hidden></div>

    <!-- Màn hình nhập / chỉnh sửa -->
    <section id="view-form" hidden>
      <h2 id="form-title">Nhập thông tin</h2>
      <form id="user-form" novalidate>
        <div class="grid">
          <label>Full name *
            <input name="full_name" required maxlength="150" />
          </label>
          <label>Email *
            <input name="email" type="email" required maxlength="150" />
          </label>
          <label>Số điện thoại
            <input name="phone" type="tel" maxlength="30" />
          </label>
          <label>Ngày sinh
            <input name="dob" type="date" />
          </label>
          <label>Giới tính
            <select name="gender">
              <option value="">-- Chọn --</option>
              <option value="male">Nam</option>
              <option value="female">Nữ</option>
              <option value="other">Khác</option>
            </select>
          </label>
          <label class="full">Địa chỉ
            <textarea name="address" rows="3"></textarea>
          </label>
        </div>
        <ul id="form-errors" class="errors"></ul>
        <div class="actions">
          <button type="submit" id="submit-btn">Lưu</button>
          <button type="button" id="cancel-btn" class="secondary">Hủy</button>
        </div>
      </form>
    </section>

    <!-- Màn hình danh sách -->
    <section id="view-list" hidden>
      <div class="list-head">
        <h2>Danh sách</h2>
        <input id="search" type="search" placeholder="Tìm theo tên / email..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Full name</th><th>Email</th><th>SĐT</th>
              <th>Ngày sinh</th><th>Giới tính</th><th>Địa chỉ</th><th></th>
            </tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="muted" hidden>Chưa có dữ liệu.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
